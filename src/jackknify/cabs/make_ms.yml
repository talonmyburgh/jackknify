cabs:
  make_ms:
    flavour: python
    command: jackknify.core.make_ms.make_ms
    name: make_ms
    info:
      Creates a simple mock MS filled with 1s for testing.
    image: ghcr.io/talonmyburgh/jackknify:hip-cargo-conversion
    inputs:
      ms-file:
        info:
          Path to create the mock MS.
        dtype: MS
        required: true
        policies:
          positional: true
        must_exist: false
      rows:
        info:
          Number of rows in the mock MS.
        dtype: int
        default: 100
      chans:
        info:
          Number of frequency channels in the mock MS.
        dtype: int
        default: 16
    outputs:
      out_ms:
        dtype: MS
        info:
          The resulting mock Measurement Set.
        implicit: '{ms_file}'
